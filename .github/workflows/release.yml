# Publishes the ready-to-run image (amd64 + arm64) to GitHub Container Registry and a
# GitHub Release with the one-line installer. Free for public repositories.
#   git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 1.0.0)"
        required: true

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          V="${INPUT_TAG:-${GITHUB_REF_NAME#v}}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          PKG=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$V" = "$PKG" ] || echo "::warning::tag $V differs from pyproject version $PKG"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chimera:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/chimera:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - name: Smoke test the published image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/chimera:${{ steps.v.outputs.version }}
          docker run -d --name hp --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges "$IMG"
          for i in $(seq 1 30); do docker inspect -f '{{.State.Health.Status}}' hp | grep -q healthy && break; sleep 1; done
          docker inspect -f '{{.State.Health.Status}}' hp | grep -q healthy

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" install.sh --repo "$GITHUB_REPOSITORY" --title "Chimera $GITHUB_REF_NAME" --notes "$(cat <<NOTES
          Install on any Linux server (Ubuntu, Debian, RHEL family, Amazon Linux):

              curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sudo CHIMERA_VERSION=$GITHUB_REF_NAME bash

          Image: \`ghcr.io/${{ github.repository_owner }}/chimera:${GITHUB_REF_NAME#v}\` (linux/amd64, linux/arm64)
          NOTES
          )"
