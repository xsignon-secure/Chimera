name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: bandit -q -ll -r src
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chimera:ci .
      - name: Smoke test container (read-only, non-root)
        run: |
          docker run -d --name hp --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v hpdata:/data -p 8000:8000 chimera:ci
          for i in $(seq 1 30); do docker inspect -f '{{.State.Health.Status}}' hp | grep -q healthy && break; sleep 1; done
          docker inspect -f '{{.State.Health.Status}}' hp | grep -q healthy
          test "$(docker exec hp id -u)" = "10001"
