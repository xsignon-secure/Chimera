[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chimera-honeypot"
version = "1.1.0"
description = "Project Chimera: a deception-driven MCP honeypot that traps compromised AI agents, tracks stolen canaries, and drives blue-team containment."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Project Chimera contributors" }]
keywords = ["mcp", "honeypot", "deception", "ai-security", "canary", "mitre-atlas", "blue-team"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Intended Audience :: Information Technology",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "anyio>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/xsignon-secure/Chimera"
Issues = "https://github.com/xsignon-secure/Chimera/issues"

[project.scripts]
chimera = "chimera.cli:main"
chimera-responder = "chimera_responder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera", "src/chimera_responder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S311", "S105", "S106", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
