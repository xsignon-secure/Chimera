# Project Chimera: production deployment.
#
#   internet / internal network ──► ingress (nginx) ──► honeypot ──► responder ──► SOAR / Wazuh / Slack
#                                     :8000              (NO egress)   (allowlisted egress)
#
# The honeypot sits only on `internal: true` networks. Docker gives such networks
# no route outside the host, so even a full compromise of the honeypot process
# cannot reach the internet or your LAN: its only peers are the ingress proxy and
# the responder. This is the "no pivot" guarantee, enforced by the network layer
# and again in code (egress allowlist, no exec primitives).
#
# Usage:  cp .env.example .env && edit .env && docker compose up -d --build

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  ingress:
    <<: *hardening
    image: nginx:1.27-alpine
    ports: ["${CHIMERA_LISTEN:-0.0.0.0}:${CHIMERA_PUBLIC_PORT:-8000}:8080"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    tmpfs: ["/tmp:size=32m"]
    cap_add: [CHOWN, SETUID, SETGID]
    networks:
      edge: { ipv4_address: 172.30.0.2 }
      decoy: { ipv4_address: 172.30.10.2 }
    depends_on: [honeypot]
    mem_limit: 128m
    cpus: 0.5

  honeypot:
    <<: *hardening
    build: .
    image: ${CHIMERA_IMAGE:-ghcr.io/xsignon-secure/chimera:1.1.0}
    command: ["serve"]
    # No env_file on purpose: the honeypot is the component attackers touch, so it
    # receives only its own CHIMERA_* settings and never the responder's secrets.
    environment:
      CHIMERA_TRUSTED_PROXIES: 172.30.10.2/32
      CHIMERA_WEBHOOK_URL: http://responder:9000/api/alerts
      CHIMERA_WEBHOOK_SECRET: ${CHIMERA_WEBHOOK_SECRET:?set CHIMERA_WEBHOOK_SECRET in .env}
      CHIMERA_PUBLIC_BASE_URL: ${CHIMERA_PUBLIC_BASE_URL:?set CHIMERA_PUBLIC_BASE_URL in .env (the URL attackers use)}
      CHIMERA_SEED: ${CHIMERA_SEED:-}
      CHIMERA_CANARY_SECRET: ${CHIMERA_CANARY_SECRET:-}
      CHIMERA_PROFILE: ${CHIMERA_PROFILE:-aws-prod-root}
      CHIMERA_SERVER_NAME: ${CHIMERA_SERVER_NAME:-}
      CHIMERA_SERVER_VERSION: ${CHIMERA_SERVER_VERSION:-}
      CHIMERA_ALERT_MIN_SEVERITY: ${CHIMERA_ALERT_MIN_SEVERITY:-medium}
      CHIMERA_CANARYTOKENS_FILE: ${CHIMERA_CANARYTOKENS_FILE:-}
      CHIMERA_SYSLOG_TARGET: ${CHIMERA_SYSLOG_TARGET:-}
      CHIMERA_SLACK_WEBHOOK_URL: ${CHIMERA_SLACK_WEBHOOK_URL:-}
      CHIMERA_DISCORD_WEBHOOK_URL: ${CHIMERA_DISCORD_WEBHOOK_URL:-}
      CHIMERA_EGRESS_ALLOWLIST: ${CHIMERA_EGRESS_ALLOWLIST:-}
      CHIMERA_RETENTION_DAYS: ${CHIMERA_RETENTION_DAYS:-}
      CHIMERA_MAX_EVENTS: ${CHIMERA_MAX_EVENTS:-}
      HEALTH_PORT: "8000"
    volumes: ["honeypot-data:/data"]
    tmpfs: ["/tmp:size=16m"]
    networks:
      decoy: { ipv4_address: 172.30.10.10 }
      alerts: { ipv4_address: 172.30.20.10 }
    mem_limit: 256m
    cpus: 1.0

  responder:
    <<: *hardening
    image: ${CHIMERA_IMAGE:-ghcr.io/xsignon-secure/chimera:1.1.0}
    entrypoint: ["chimera-responder"]
    command: []
    env_file: .env
    environment:
      RESPONDER_HONEYPOT_SECRET: ${CHIMERA_WEBHOOK_SECRET}
      # The honeypot's subnet may only POST alerts: no dashboard, MCP or feed access.
      RESPONDER_ALERTS_ONLY_NETWORKS: 172.30.20.0/24
      # Docker's own subnets are never isolated. Clients arriving over IPv6, or through
      # docker-proxy, show up as the edge gateway (172.30.0.1); isolating it would cut
      # off everyone. Publish over IPv4 with iptables NAT (Docker's default) for real IPs.
      RESPONDER_PROTECTED_NETWORKS: 172.30.0.0/24,172.30.10.0/24,172.30.20.0/24,${RESPONDER_PROTECTED_NETWORKS:-}
      HEALTH_PORT: "9000"
    volumes: ["responder-data:/data"]
    tmpfs: ["/tmp:size=16m"]
    ports: ["${RESPONDER_LISTEN:-127.0.0.1}:${RESPONDER_PUBLIC_PORT:-9000}:9000"]
    networks:
      alerts: {}
      soc: {}
    depends_on: [honeypot]
    mem_limit: 256m
    cpus: 0.5

networks:
  edge:                    # ingress only: published port
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
  decoy:                   # proxy <-> honeypot, no outside route
    internal: true
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  alerts:                  # honeypot -> responder, no outside route
    internal: true
    ipam: { config: [{ subnet: 172.30.20.0/24 }] }
  soc: {}                  # responder -> your SOAR / Wazuh / Slack

volumes:
  honeypot-data: {}
  responder-data: {}
