# Ingress for the decoy. The honeypot itself has no route to the internet;
# this proxy is its only door, and it is one-way (inbound only).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=perip:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream honeypot { server honeypot:8000; keepalive 16; }

    server {
        listen 8080;
        client_max_body_size 512k;
        client_body_timeout 15s;
        client_header_timeout 15s;
        limit_req zone=perip burst=40 nodelay;
        limit_conn conn 20;

        location / {
            proxy_pass http://honeypot;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwrite (never append) so attackers cannot spoof their address.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;            # MCP streams responses over SSE
            proxy_read_timeout 300s;     # bounded so idle streams cannot pin connections
        }
    }
}
